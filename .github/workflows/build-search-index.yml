name: Build Search Index

on:
  push:
    branches: [main]

jobs:
  build-index:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check metadata completeness
        run: python3 scripts/check_metadata.py

      - name: Build index
        run: python3 scripts/build_index.py

      - name: Commit updated index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add search_index.json
          git diff --staged --quiet || git commit -m "chore: rebuild search index [skip ci]"
          git push
