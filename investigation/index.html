<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Investigation — Phoenix FBI Delta Green</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="cy"></div>
  <canvas id="connect-canvas"></canvas>

  <!-- GM banner -->
  <div id="gm-banner">GM MODE</div>

  <!-- Toolbar (top-right) -->
  <div id="toolbar">
    <div id="toolbar-panel">
      <div class="toolbar-group" id="zoom-group">
        <button class="tb-btn" id="btn-zoom-in"  title="Zoom in (+)">+</button>
        <button class="tb-btn" id="btn-zoom-out" title="Zoom out (−)">−</button>
        <button class="tb-btn" id="btn-fit"      title="Fit graph">⊡</button>
      </div>
      <div class="toolbar-group" id="labels-group">
        <span class="tb-label">Edge labels</span>
        <label class="toggle">
          <input type="checkbox" id="toggle-labels" checked>
          <span class="toggle-slider"></span>
        </label>
      </div>
      <div class="toolbar-group font-group">
        <span class="tb-label">Font size</span>
        <div class="font-row">
          <span class="tb-label muted">Nodes</span>
          <button class="tb-btn" id="btn-node-font-down">−</button>
          <span class="tb-size" id="node-font-display">11</span>
          <button class="tb-btn" id="btn-node-font-up">+</button>
        </div>
        <div class="font-row">
          <span class="tb-label muted">Edges</span>
          <button class="tb-btn" id="btn-edge-font-down">−</button>
          <span class="tb-size" id="edge-font-display">10</span>
          <button class="tb-btn" id="btn-edge-font-up">+</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Save bar (bottom-centre) -->
  <div id="save-bar">
    <span id="save-status">No unsaved changes</span>
    <button class="save-btn" id="btn-save">Save draft</button>
    <button class="save-btn primary" id="btn-publish" style="display:none">Publish to master</button>
    <button class="save-btn danger"  id="btn-load-draft" style="display:none">Load player draft</button>
  </div>

  <!-- Context menu -->
  <div id="ctx-menu"></div>

  <!-- Modal overlay -->
  <div id="modal-overlay">
    <div id="modal">
      <h2 id="modal-title"></h2>
      <div id="modal-body"></div>
      <div class="modal-actions">
        <button class="btn-cancel" id="modal-cancel">Cancel</button>
        <button class="btn-confirm" id="modal-confirm">OK</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/cytoscape@3.30.1/dist/cytoscape.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/webcola@3.4.0/WebCola/cola.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/cytoscape-cola@2.5.1/cytoscape-cola.js"></script>
  <script src="app.js"></script>
</body>
</html>
