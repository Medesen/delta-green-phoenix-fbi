<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phoenix FBI — Delta Green</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="header">
    <h1>Phoenix FBI - Delta Green</h1>
    <span class="subtitle">A Delta Green Campaign</span>
  </div>

  <div id="page">
    <div id="sidebar">
      <nav>
        <ul>
          <li><a href="index.html" class="active">Home</a></li>
          <li><a href="sourcebooks.html">Sourcebooks</a></li>
          <li><a href="dramatis-personae.html">Dramatis Personae</a></li>
          <li><a href="session-logs.html">Session Logs</a></li>
          <li><a href="handouts.html">Handouts</a></li>
          <li><a href="maps.html">Maps</a></li>
          <li><a href="miscellaneous.html">Miscellaneous</a></li>
        </ul>
      </nav>
    </div>

    <div id="content">
      <h2>Home</h2>
      <div id="content-body"><p>Loading...</p></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    fetch('https://raw.githubusercontent.com/Medesen/delta-green-phoenix-fbi/main/content/home.md')
      .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
      .then(text => {
        const div = document.getElementById('content-body');
        div.innerHTML = marked.parse(text);
        div.querySelectorAll('a').forEach(a => {
          a.target = '_blank';
          a.rel = 'noopener';
        });
      })
      .catch(() => {
        document.getElementById('content-body').innerHTML =
          '<p style="color:#888">Content could not be loaded. Try refreshing.</p>';
      });
  </script>
  <script>
    const renderer = new marked.Renderer();
    renderer.link = (href, title, text) =>
      `<a href="${href}" target="_blank" rel="noopener">${text}</a>`;
    marked.use({ renderer });

    fetch('content/home.md')
      .then(r => r.text())
      .then(text => {
        document.getElementById('content-body').innerHTML = marked.parse(text);
      });
  </script>
  <script>
    fetch('content/home.md')
      .then(r => r.text())
      .then(text => {
        document.getElementById('content-body').innerHTML = marked.parse(text);
      });
  </script>

</body>
</html>
