</head>
<body>

  <div id="header">
    <h1>Phoenix FBI - Delta Green</h1>
    <span class="subtitle">A Delta Green Campaign</span>
  </div>

  <div id="page">
    <div id="sidebar">
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="sourcebooks.html">Sourcebooks</a></li>
          <li><a href="dramatis-personae.html">Dramatis Personae</a></li>
          <li><a href="session-logs.html" class="active">Session Logs</a></li>
          <li><a href="handouts.html">Handouts</a></li>

          <li><a href="miscellaneous.html">Miscellaneous</a></li>
          <li><a href="https://dg-investigation.pages.dev/" target="_blank">Investigation</a></li>
        </ul>
      </nav>
      <hr class="sidebar-divider">
      <div id="search-box">
        <input type="text" id="search-input" placeholder="Search…" autocomplete="off">
        <div id="search-dropdown" class="search-dropdown"></div>
      </div>
    </div>

    <div id="content">
      <h2>Session Logs</h2>
      <div id="log-list"><p>Loading session logs...</p></div>
    </div>
  </div>

  <script src="search.js"></script>
  <script>
    var REPO   = 'Medesen/delta-green-phoenix-fbi';
    var FOLDER = 'assets/session_logs';

    function parseFilename(name) {
      var m = name.match(/^(\d+)_session_log_(\d{4})-(\d{2})-(\d{2})\.md$/);
      if (!m) return name.replace('.md', '');
      var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      return 'Session ' + parseInt(m[1]) + ' — ' + parseInt(m[4]) + ' ' + months[parseInt(m[3])-1] + ' ' + m[2];
    }

    function showList(files) {
      var listDiv = document.getElementById('log-list');
      if (files.length === 0) {
        listDiv.innerHTML = '<p>No session logs yet.</p>';
        return;
      }
      var sorted = files.slice().sort(function (a, b) { return b.name.localeCompare(a.name); });
      var ul = document.createElement('ul');
      ul.className = 'file-list';
      sorted.forEach(function (file) {
        var li = document.createElement('li');
        var a  = document.createElement('a');
        a.href   = 'session-log.html?log=' + encodeURIComponent(file.name);
        a.target = '_blank';
        a.rel    = 'noopener';
        a.textContent = parseFilename(file.name);
        li.appendChild(a);
        ul.appendChild(li);
      });
      listDiv.innerHTML = '';
      listDiv.appendChild(ul);
    }

    fetch('https://api.github.com/repos/' + REPO + '/contents/' + FOLDER)
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (files) { showList(files.filter(function (f) { return f.name.endsWith('.md'); })); })
      .catch(function () {
        document.getElementById('log-list').innerHTML =
          '<p style="color:#888">Could not load session list. Try refreshing.</p>';
      });
  </script>

</body>
</html>
